<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OrbitDB</title>
    <!-- connect-src is widened for the Vite dev server only, by a transform in
         electron.vite.config.ts; the renderer itself makes no network calls. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #ffffff;
        color: #242629;
        font-family:
          'Inter Variable',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #ffffff;
      }
      #splash .logo {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      #splash .brand {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #6e7074;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 100 100"
          class="logo"
          aria-label="OrbitDB"
        >
          <defs>
            <linearGradient id="splash-silver" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6b6e74" />
              <stop offset="1" stop-color="#242629" />
            </linearGradient>
          </defs>
          <g fill="url(#splash-silver)">
            <path d="M24.00,24.00 L48.00,24.00 A24,24 0 1 1 24.00,0.00 Z" />
            <path d="M76.00,24.00 L100.00,24.00 A24,24 0 1 0 76.00,48.00 Z" />
            <path d="M24.00,76.00 L0.00,76.00 A24,24 0 1 0 24.00,52.00 Z" />
            <path d="M76.00,76.00 L52.00,76.00 A24,24 0 1 1 76.00,100.00 Z" />
          </g>
        </svg>
        <div class="brand">OrbitDB</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
