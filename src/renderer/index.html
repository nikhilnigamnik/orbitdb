<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OrbitDB</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: https:"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e1013;
        color: #e6e8ec;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0e1013;
      }
      #splash .logo {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      #splash .brand {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #9aa1ac;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="200"
          height="200"
          viewBox="0 0 100 100"
          class="animate-pulse [animation-duration:1.6s]"
          aria-label="OrbitDB"
        >
          <style>
            @keyframes orbit-pulse {
              0%,
              100% {
                opacity: 1;
              }
              50% {
                opacity: 0.5;
              }
            }
            svg {
              animation: orbit-pulse 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
          </style>
          <defs>
            <linearGradient
              id="_R_955esnealb_"
              gradientUnits="userSpaceOnUse"
              x1="0"
              y1="0"
              x2="0"
              y2="100"
            >
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="32%" stop-color="#ededed" />
              <stop offset="52%" stop-color="#cdcdcd" />
              <stop offset="72%" stop-color="#b0b0b0" />
              <stop offset="100%" stop-color="#8c8c8c" />
            </linearGradient>
          </defs>
          <circle
            cx="50"
            cy="50"
            r="44"
            fill="none"
            stroke="url(#_R_955esnealb_)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="226 50"
          />
          <circle
            cx="50"
            cy="50"
            r="32"
            fill="none"
            stroke="url(#_R_955esnealb_)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="150 51"
            transform="rotate(120 50 50)"
          />
          <circle
            cx="50"
            cy="50"
            r="20"
            fill="none"
            stroke="url(#_R_955esnealb_)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-dasharray="88 38"
            transform="rotate(240 50 50)"
          />
          <circle cx="50" cy="50" r="6" fill="url(#_R_955esnealb_)" />
        </svg>
        <div class="brand">OrbitDB</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
