<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OrbitDB</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' ws: https:"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0e0e0f;
        color: #e5e5e5;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0e0e0f;
      }
      #splash .logo {
        width: 64px;
        height: 64px;
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
      #splash .brand {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: #a1a1aa;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="splash">
        <svg
          class="logo"
          viewBox="0 0 100 100"
          fill="#1C1C1E"
          xmlns="http://www.w3.org/2000/svg"
          aria-label="OrbitDB"
        >
          <path
            fill-rule="evenodd"
            d="M 50 50 m -50 0 a 50 50 0 1 0 100 0 a 50 50 0 1 0 -100 0 Z M 50 50 m -42 0 a 42 42 0 1 0 84 0 a 42 42 0 1 0 -84 0 Z M 50 50 m -33 0 a 33 33 0 1 0 66 0 a 33 33 0 1 0 -66 0 Z M 50 50 m -25 0 a 25 25 0 1 0 50 0 a 25 25 0 1 0 -50 0 Z M 50 50 m -18 0 a 18 18 0 1 0 36 0 a 18 18 0 1 0 -36 0 Z M 50 50 m -12 0 a 12 12 0 1 0 24 0 a 12 12 0 1 0 -24 0 Z M 50 50 m -6 0 a 6 6 0 1 0 12 0 a 6 6 0 1 0 -12 0 Z"
          />
        </svg>
        <div class="brand">OrbitDB</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
